<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Laporan Pekerjaan - Sumber Teknik</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;user-select:none;-webkit-user-select:none;}
body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
.app{width:100%;max-width:430px;background:#f7fbf8;height:100vh;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.25);}

.header{padding:20px;background:linear-gradient(135deg,#0d5c2a,#1f8f45);color:white;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
.back-btn{cursor:pointer;font-size:24px;color:white;}
.header-text h1{font-size:1.1rem;font-weight:700;}

.content{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:18px;padding-bottom:120px;}
.form-card{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,0.08);}

.input-container{position:relative;margin-bottom:16px;}
.input-container input,.input-container select{
width:100%;padding:14px 36px;border:1px solid #d9e6dd;border-radius:12px;font-size:0.95rem;background:white;
}

.input-container label{
position:absolute;left:36px;top:14px;color:#4b5e55;font-size:0.85rem;
pointer-events:none;transition:0.2s;background:white;padding:0 4px;
}

.input-container input:focus + label,
.input-container input:not(:placeholder-shown) + label,
.input-container select:focus + label,
.input-container select:not([value=""]) + label{
top:-8px;left:12px;font-size:0.7rem;color:#1f8f45;
}

.material-icons{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#1f8f45;}

.password-wrapper{position:relative;margin-bottom:16px;}
.password-wrapper input{width:100%;padding:14px 44px 14px 36px;border:1px solid #d9e6dd;border-radius:12px;}
.password-wrapper .right-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;}

.helper-box{position:absolute;background:white;border:1px solid #ccc;border-radius:10px;display:none;max-height:150px;overflow:auto;z-index:10;}
.helper-item{padding:10px;display:flex;gap:10px;cursor:pointer;}

.submit-btn{width:100%;padding:12px;border:none;border-radius:12px;background:#1f8f45;color:white;}
.submit-btn:disabled{background:#a1c8a2;}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f8f45;color:white;padding:10px;border-radius:10px;opacity:0;}
</style>
</head>

<body>

<div class="app">

<div class="header">
<span class="material-icons back-btn" onclick="goBack()">arrow_back</span>
<h1>Laporan Pekerjaan</h1>
</div>

<div class="content">
<div class="form-card">

<input type="date" id="tanggal" readonly>

<input type="text" id="namaPetani" placeholder="Nama Petani">
<input type="number" id="jumlahKarungan" placeholder="Jumlah Karungan">

<select id="namaOperator">
<option value="">Pilih Operator</option>
</select>

<input type="password" id="sandiOperator" placeholder="Sandi Operator">

<input type="text" id="namaHelper" placeholder="Helper" readonly>
<div id="helperBox" class="helper-box"></div>

<select id="jumlahHelper">
<option value="">Jumlah Helper</option>
<option value="1">1</option>
<option value="2">2</option>
</select>

<input type="number" id="hargaPerKarung" placeholder="Harga">

<select id="lokasiKerja"></select>
<select id="pengurus"><option value="">Pilih Pengurus</option></select>

<button id="submitBtn" onclick="submitForm()" disabled>Submit</button>

</div>
</div>
</div>

<div id="toast"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxfPuJmalnJcxoLCfgvERkKMlPX1j2e5PEPn_zgpxDj9aszo8g9tp1UtCqPei_5AQgv/exec";

let pinjamanList=[];

const tanggalInput=document.getElementById("tanggal");
tanggalInput.value=new Date().toISOString().split("T")[0];

const operatorSelect=document.getElementById("namaOperator");
const lokasiSelect=document.getElementById("lokasiKerja");
const pengurusSelect=document.getElementById("pengurus");
const helperInput=document.getElementById("namaHelper");
const helperBox=document.getElementById("helperBox");
const jumlahHelper=document.getElementById("jumlahHelper");
const sandiInput=document.getElementById("sandiOperator");
const submitBtn=document.getElementById("submitBtn");

function checkForm(){
const valid =
tanggalInput.value &&
namaPetani.value &&
jumlahKarungan.value &&
operatorSelect.value &&
sandiInput.value &&
helperInput.value &&
jumlahHelper.value &&
hargaPerKarung.value &&
lokasiSelect.value &&
pengurusSelect.value;

submitBtn.disabled=!valid;
}

document.querySelectorAll("input,select").forEach(el=>{
el.addEventListener("input",checkForm);
el.addEventListener("change",checkForm);
});

fetch(API_URL)
.then(res=>res.json())
.then(data=>{

data.lokasiKerjaAktif.forEach(l=>{
let o=document.createElement("option");
o.value=l;o.text=l;
lokasiSelect.appendChild(o);
});

data.totalUnitAktif.forEach((o,i)=>{
let op=document.createElement("option");
op.value=o;op.text=o;
operatorSelect.appendChild(op);
pinjamanList[i]=data.totalPinjaman[i];
});

data.pendapatanBersih.forEach(p=>{
let op=document.createElement("option");
op.value=p;op.text=p;
pengurusSelect.appendChild(op);
});

data.totalTransaksi.forEach(n=>{
let div=document.createElement("div");
div.className="helper-item";

let cb=document.createElement("input");
cb.type="checkbox";
cb.value=n;

cb.onchange=()=>{
let checked=helperBox.querySelectorAll("input:checked");
helperInput.value=[...checked].map(x=>x.value).join(",");
jumlahHelper.value=checked.length;
checkForm();
};

div.onclick=()=>{
cb.checked=!cb.checked;
cb.onchange();
};

div.appendChild(cb);
div.appendChild(document.createTextNode(n));
helperBox.appendChild(div);
});

});

helperInput.onclick=()=>{
helperBox.style.display=helperBox.style.display==="block"?"none":"block";
};

function submitForm(){
const idx=operatorSelect.selectedIndex-1;
if(pinjamanList[idx]!=sandiInput.value){alert("Sandi salah");return;}

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
tanggal:tanggalInput.value,
namaPetani:namaPetani.value,
jumlahKarungan:jumlahKarungan.value,
namaOperator:operatorSelect.value,
namaHelper:helperInput.value,
jumlahHelper:jumlahHelper.value,
hargaPerKarung:hargaPerKarung.value,
lokasiKerja:lokasiSelect.value,
pengurus:pengurusSelect.value
})
});
}
</script>

</body>
</html>
