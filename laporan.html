<!DOCTYPE html>  
<html lang="id">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
<title>Laporan Pekerjaan - Sumber Teknik</title>  
  
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">  
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">  
  
<style>  
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;user-select:none;-webkit-user-select:none;}  
body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}  
.app{width:100%;max-width:430px;background:#f7fbf8;height:100vh;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.25);}  
  
.header{padding:20px;background:linear-gradient(135deg,#0d5c2a,#1f8f45);color:white;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}  
.back-btn{cursor:pointer;font-size:24px;color:white;}  
.header-text h1{font-size:1.1rem;font-weight:700;}  
  
.content{  
  flex:1;  
  overflow-y:auto;  
  display:flex;  
  flex-direction:column;  
  gap:16px;  
  padding:18px;  
  padding-top:20px;  
  padding-bottom:120px;  
}  
  
.form-card{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,0.08);}  
  
.tap-highlight{transition:0.15s;background:#00000022;}  
input.tap-highlight,select.tap-highlight{-webkit-tap-highlight-color:transparent;outline:none;}  
  
.input-container{position:relative;margin-bottom:16px;}  
.input-container input,.input-container select{  
width:100%;  
padding:14px 36px 14px 36px;  
border:1px solid #d9e6dd;  
border-radius:12px;  
font-size:0.95rem;  
background:white;  
}  
  
.input-container input:focus,.input-container select:focus{border-color:#1f8f45;}  
  
.input-container label{  
position:absolute;  
left:36px;  
top:14px;  
color:#4b5e55;  
font-size:0.85rem;  
pointer-events:none;  
transition:0.2s;  
background:white;  
padding:0 4px;  
}  
  
.input-container input:focus + label,  
.input-container input:not(:placeholder-shown) + label,  
.input-container input:valid + label,  
.input-container select:focus + label,  
.input-container select:not([value=""]) + label{  
top:-8px;  
left:12px;  
font-size:0.7rem;  
color:#1f8f45;  
}  
  
.input-container .material-icons{  
position:absolute;  
left:8px;  
top:50%;  
transform:translateY(-50%);  
color:#1f8f45;  
pointer-events:none;  
font-size:20px;  
}  
  
.password-wrapper{  
  position:relative;  
  margin-bottom:16px;  
}  
.password-wrapper input{  
  width:100%;  
  padding:14px 44px 14px 36px;  
  border:1px solid #d9e6dd;  
  border-radius:12px;  
  font-size:0.95rem;  
  background:white;  
}  
.password-wrapper label{  
  position:absolute;  
  left:36px;  
  top:14px;  
  font-size:0.85rem;  
  color:#4b5e55;  
  pointer-events:none;  
  transition:0.2s;  
  background:white;  
  padding:0 4px;  
}  
.password-wrapper input:focus + label,  
.password-wrapper input:not(:placeholder-shown) + label{  
  top:-8px;  
  left:12px;  
  font-size:0.7rem;  
  color:#1f8f45;  
}  
.password-wrapper .left-icon,  
.password-wrapper .right-icon{  
position:absolute;  
top:50%;  
transform:translateY(-50%);  
font-size:20px;  
color:#1f8f45;  
}  
.password-wrapper .left-icon{left:10px;}  
.password-wrapper .right-icon{right:10px;cursor:pointer;z-index:2;}  
  
.helper-box{  
position:absolute;  
top:100%;  
left:0;  
right:0;  
background:#ffffff;  
border:1px solid #d9e6dd;  
border-radius:12px;  
max-height:180px;  
overflow-y:auto;  
display:none;  
z-index:30;  
margin-top:6px;  
box-shadow:0 8px 20px rgba(0,0,0,0.08);  
padding:6px;  
}  
.helper-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;}  
.helper-item:hover{background:#eef6f1;}  
.helper-item input{width:18px;height:18px;accent-color:#1f8f45;}  
.helper-warning{font-size:0.75rem;color:#c0392b;margin-top:4px;display:none;}  
  
.submit-btn{  
width:100%;  
padding:12px;  
border:none;  
border-radius:12px;  
background:#1f8f45;  
color:white;  
font-weight:600;  
cursor:pointer;  
}  
.submit-btn:disabled{background:#a1c8a2;}  
  
#toast{  
  position:fixed;  
  bottom:30px;  
  left:50%;  
  transform:translateX(-50%) translateY(20px);  
  background:#1f8f45;  
  color:white;  
  padding:12px 24px;  
  border-radius:12px;  
  box-shadow:0 5px 15px rgba(0,0,0,0.3);  
  opacity:0;  
  pointer-events:none;  
  transition:opacity 0.3s, transform 0.3s;  
  z-index:9999;  
  font-weight:600;  
}  
</style>  
</head>  
  
<body>  
  
<div class="app">  
  
<div class="header">  
<span class="material-icons back-btn" onclick="goBack()">arrow_back</span>  
<div class="header-text">  
<h1>Laporan Pekerjaan</h1>  
</div>  
</div>  
  
<div class="content">  
<div class="form-card">  

<!-- FORM SAMA PERSIS -->

<div class="input-container">
<span class="material-icons">calendar_today</span>
<input type="date" id="tanggal" class="tap-highlight" placeholder=" " readonly required>
<label>Tanggal</label>
</div>

<div class="input-container">
<span class="material-icons">person</span>
<input type="text" id="namaPetani" placeholder=" " required>
<label>Nama Petani</label>
</div>

<div class="input-container">
<span class="material-icons">inventory_2</span>
<input type="number" id="jumlahKarungan" placeholder=" " required>
<label>Jumlah Karungan</label>
</div>

<div class="input-container">
<span class="material-icons">construction</span>
<select id="namaOperator" class="tap-highlight" required>
<option value="">Pilih Operator</option>
</select>
<label>Nama Operator</label>
</div>

<div class="password-wrapper">
<input type="password" id="sandiOperator" placeholder=" " required>
<label>Sandi Operator</label>
<span class="material-icons left-icon">lock</span>
<span class="material-icons right-icon" id="toggleSandi">visibility</span>
</div>

<div class="input-container">
<span class="material-icons">group</span>
<input type="text" id="namaHelper" placeholder=" " readonly>
<label>Nama Helper</label>
<div id="helperBox" class="helper-box"></div>
<div id="helperWarning" class="helper-warning">Maksimal 2 helper</div>
</div>

<div class="input-container">
<span class="material-icons">format_list_numbered</span>
<select id="jumlahHelper" class="tap-highlight">
<option value="">Pilih Jumlah Helper</option>
</select>
<label>Jumlah Helper</label>
</div>

<div class="input-container">
<span class="material-icons">attach_money</span>
<input type="number" id="hargaPerKarung" placeholder=" ">
<label>Harga per Karung</label>
</div>

<div class="input-container">
<span class="material-icons">location_on</span>
<select id="lokasiKerja" class="tap-highlight"></select>
<label>Lokasi Kerja Aktif</label>
</div>

<div class="input-container">
<span class="material-icons">badge</span>
<select id="pengurus" class="tap-highlight">
<option value="">Pilih Pengurus</option>
</select>
<label>Pengurus</label>
</div>

<button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit</button>

</div>
</div>
</div>

<div id="toast"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxfPuJmalnJcxoLCfgvERkKMlPX1j2e5PEPn_zgpxDj9aszo8g9tp1UtCqPei_5AQgv/exec";

let pinjamanList=[];

const sandiInput=document.getElementById("sandiOperator");
const toggleSandi=document.getElementById("toggleSandi");

toggleSandi.addEventListener("click",()=>{
if(sandiInput.type==="password"){
sandiInput.type="text";
toggleSandi.innerText="visibility_off";
}else{
sandiInput.type="password";
toggleSandi.innerText="visibility";
}
});

function goBack(){window.location.href="menu.html";}

const tanggalInput=document.getElementById("tanggal");
tanggalInput.value=new Date().toISOString().split("T")[0];

const jumlahHelper=document.getElementById("jumlahHelper");
for(let i=1;i<=2;i++){
let opt=document.createElement("option");
opt.value=i;
opt.text=i;
jumlahHelper.appendChild(opt);
}

const lokasiSelect=document.getElementById("lokasiKerja");
const operatorSelect=document.getElementById("namaOperator");
const pengurusSelect=document.getElementById("pengurus");

const helperBox=document.getElementById("helperBox");
const helperInput=document.getElementById("namaHelper");
const helperWarning=document.getElementById("helperWarning");

/* VALIDASI */
function isFormValid(){
const fields=[
tanggalInput.value,
document.getElementById("namaPetani").value,
document.getElementById("jumlahKarungan").value,
operatorSelect.value,
sandiInput.value,
lokasiSelect.value,
pengurusSelect.value
];

for(let f of fields){
if(!f || f.toString().trim()===""){return false;}
}

if(jumlahHelper.value && !helperInput.value){return false;}

return true;
}

const toast=document.getElementById("toast");

function showToast(message,success=true){
toast.innerText=message;
toast.style.background=success?"#1f8f45":"#e74c3c";
toast.style.opacity="1";
toast.style.transform="translateX(-50%) translateY(0)";
setTimeout(()=>{
toast.style.opacity="0";
toast.style.transform="translateX(-50%) translateY(20px)";
},2000);
}

let submitting=false;

function submitForm(){

if(!isFormValid()){
showToast("Semua field wajib diisi",false);
return;
}

if(submitting) return;

const operatorIndex=operatorSelect.selectedIndex-1;
const sandi=sandiInput.value;

if(operatorIndex<0){showToast("Pilih operator dulu",false);return;}
if(pinjamanList[operatorIndex]!=sandi){showToast("Sandi salah",false);return;}

submitting=true;
document.getElementById("submitBtn").disabled=true;

const data={
tanggal:tanggalInput.value,
namaPetani:document.getElementById("namaPetani").value,
jumlahKarungan:document.getElementById("jumlahKarungan").value,
namaOperator:operatorSelect.value,
namaHelper:helperInput.value,
jumlahHelper:jumlahHelper.value,
hargaPerKarung:document.getElementById("hargaPerKarung").value,
lokasiKerja:lokasiSelect.value,
pengurus:pengurusSelect.value
};

fetch(API_URL,{
method:"POST",
body:JSON.stringify(data)
})
.then(res=>res.json())
.then(resp=>{
submitting=false;
document.getElementById("submitBtn").disabled=false;

if(resp.status==="success"){
showToast("Laporan berhasil dikirim",true);

document.querySelectorAll("#namaPetani,#jumlahKarungan,#namaHelper,#hargaPerKarung,#sandiOperator")
.forEach(i=>i.value="");

pengurusSelect.selectedIndex=0;
helperBox.querySelectorAll("input").forEach(cb=>cb.checked=false);
jumlahHelper.selectedIndex=0;
lokasiSelect.selectedIndex=0;
operatorSelect.selectedIndex=0;
}
});
}
</script>

</body>
</html>
