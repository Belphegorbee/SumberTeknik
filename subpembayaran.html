<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pembayaran - CV Sumber Teknik</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
}

/* Hapus highlight biru default di mobile */
.menu-item, .menu-trigger {
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  cursor:pointer;
}

body{
  height:100vh;
  background:#0b1f12;
  font-family:'Segoe UI',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* FRAME HP */
.app{
  width:100%;
  max-width:430px;
  height:100vh;
  background:linear-gradient(180deg,#102a18,#07140c);
  display:flex;
  flex-direction:column;
  position:relative;
}

/* HEADER */
.header{
  padding:20px;
  background:#0f301b;
  display:flex;
  align-items:center;
  box-shadow:0 4px 15px rgba(0,0,0,0.6);
}

.menu-trigger{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:4px 8px;
  border-radius:8px;
  transition:0.2s;
}

.menu-trigger:active{
  background:#00000055;
  transform:scale(0.9);
}

.brand{
  display:flex;
  flex-direction:column;
  margin-left:12px;
}

.brand h1{
  font-size:1.1rem;
  font-weight:700;
  color:#9eff6d;
}

.brand span{
  font-size:0.7rem;
  color:#b7d8c2;
}

/* MENU AREA */
.menu-area{
  flex:1;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
  overflow-y:auto;
}

/* MENU ITEM */
.menu-item{
  display:flex;
  align-items:center;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(145deg,#153c22,#0d2416);
  box-shadow:0 10px 25px rgba(0,0,0,0.6);
  border:1px solid rgba(158,255,109,0.2);
  transition:0.3s;
}

.menu-item:active{
  transform:scale(0.97);
  background:linear-gradient(145deg,#000000,#000000);
}

.icon-box{
  width:45px;
  height:45px;
  background:#1f4d2c;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#9eff6d;
  font-weight:bold;
  margin-right:15px;
}

.menu-text{
  display:flex;
  flex-direction:column;
}

.menu-text b{
  font-size:0.95rem;
  color:#ffffff;
}

.menu-text span{
  font-size:0.7rem;
  color:#9db8a7;
}

/* BOTTOM NAV */
.bottom-nav{
  height:60px;
  background:#0f301b;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -4px 15px rgba(0,0,0,0.6);
}

.nav{
  font-size:0.7rem;
  color:#7aa88a;
}

.nav.active{
  color:#9eff6d;
  font-weight:600;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <!-- Icon kembali "<" pojok kiri -->
    <div class="menu-trigger" onclick="window.location.href='menu.html'">
      <span style="color:#9eff6d;font-size:24px;font-weight:bold;">&lt;</span>
    </div>

    <!-- Judul & keterangan -->
    <div class="brand">
      <h1>PEMBAYARAN</h1>
      <span>pengelolaan tagihan dan pembayaran cv sumber teknik</span>
    </div>
  </div>

  <!-- MENU AREA -->
  <div class="menu-area">

    <!-- Icon 1: List Tagihan Petani -->
    <div class="menu-item" onclick="window.location.href='listtagihan.html'">
      <div class="icon-box">01</div>
      <div class="menu-text">
        <b>List Tagihan Petani</b>
        <span>Lihat semua tagihan petani</span>
      </div>
    </div>

    <!-- Icon 2: Pembayaran -->
    <div class="menu-item" onclick="window.location.href='pembayaran_form.html'">
      <div class="icon-box">02</div>
      <div class="menu-text">
        <b>Pembayaran</b>
        <span>Input pembayaran petani</span>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav active">Pembayaran</div>
    <div class="nav">Data</div>
    <div class="nav">Laporan</div>
    <div class="nav">Setting</div>
  </div>

</div>

</body>
</html>
