<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dashboard - Sumber Teknik</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
}

body{
  height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  font-family:'Inter',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100vh;
  background:#f7fbf8;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,0.25);
}

/* HEADER */
.header{
  padding:20px;
  background:linear-gradient(135deg,#0d5c2a,#1f8f45);
  color:white;
  display:flex;
  align-items:center;
  gap:12px;
}

.back-btn{
  cursor:pointer;
  font-size:24px;
}

.header-text{
  flex:1;
}

.header-text h1{
  font-size:1.1rem;
  font-weight:700;
}

.last-update{
  font-size:0.7rem;
  opacity:0.8;
  margin-top:4px;
}

/* CONTENT */
.content{
  flex:1;
  padding:18px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
  transition:0.3s;
  border:1px solid #e4efe8;
}

.card:active{
  transform:scale(0.98);
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
  font-size:0.95rem;
  color:#1c2b22;
}

.title-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-circle{
  width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#e4f5ea;
  color:#1f8f45;
}

.card-content{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.4s ease;
  margin-top:0;
  font-size:0.85rem;
  color:#4b5e55;
  line-height:1.6;
}

.card.open .card-content{
  margin-top:12px;
  max-height:500px;
}

.arrow{
  font-size:20px;
  color:#1f8f45;
  transition:0.3s;
}

.card.open .arrow{
  transform:rotate(90deg);
}

/* PIN SCREEN */
.pin-screen{
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.pin-box{
  width:85%;
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

.pin-box h2{
  font-size:1rem;
  margin-bottom:15px;
  color:#1c2b22;
}

.pin-input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #d9e6dd;
  text-align:center;
  font-size:1.2rem;
  letter-spacing:6px;
  outline:none;
}

.pin-btn{
  margin-top:15px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:12px;
  background:#1f8f45;
  color:white;
  font-weight:600;
}

.error{
  margin-top:10px;
  font-size:0.7rem;
  color:#e74c3c;
  display:none;
}
</style>
</head>

<body>

<div class="app">

  <div class="pin-screen" id="pinScreen">
    <div class="pin-box">
      <h2>Akses Dashboard Internal</h2>
      <input type="password" maxlength="4" class="pin-input" id="pinInput">
      <button class="pin-btn" onclick="checkPin()">Masuk Sistem</button>
      <div class="error" id="errorText">PIN salah</div>
    </div>
  </div>

  <div class="header">
    <span class="material-icons back-btn" onclick="goBack()">arrow_back</span>
    <div class="header-text">
      <h1>Dashboard Operasional</h1>
      <div class="last-update" id="lastUpdate"></div>
    </div>
  </div>

  <div class="content" id="dashboard-container"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxMMHqtzaV0Ng-f9Cn-Q9sB9TdrmvMCbNeqIOePxDksyVUNP8ofDFNsl7uts97NCShpFA/exec";

function goBack(){
  window.location.href="menu.html";
}

const container = document.getElementById("dashboard-container");
const lastUpdate = document.getElementById("lastUpdate");
const pinScreen = document.getElementById("pinScreen");
const pinInput = document.getElementById("pinInput");
const errorText = document.getElementById("errorText");

if(sessionStorage.getItem("auth")==="true"){
  pinScreen.style.display="none";
  loadDashboard();
}

function checkPin(){
  if(pinInput.value==="1234"){
    sessionStorage.setItem("auth","true");
    pinScreen.style.display="none";
    loadDashboard();
  }else{
    errorText.style.display="block";
  }
}

function loadDashboard(){
  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{

    container.innerHTML="";

    const items=[
      {title:"Total Unit Aktif",icon:"precision_manufacturing",value:data.totalUnitAktif},
      {title:"Total Transaksi",icon:"receipt_long",value:data.totalTransaksi},
      {title:"Pendapatan Bersih",icon:"trending_up",value:data.pendapatanBersih},
      {title:"Pengeluaran Total",icon:"payments",value:data.pengeluaranTotal},
      {title:"Lokasi Kerja Aktif",icon:"location_on",value:data.lokasiKerjaAktif},
      {title:"Total Pinjaman Karyawan",icon:"account_balance",value:data.totalPinjaman}
    ];

    items.forEach(item=>{
      const card=document.createElement("div");
      card.classList.add("card");

      const title=document.createElement("div");
      title.classList.add("card-title");

      title.innerHTML=`
        <div class="title-left">
          <div class="icon-circle">
            <span class="material-icons">${item.icon}</span>
          </div>
          ${item.title}
        </div>
        <span class="material-icons arrow">chevron_right</span>
      `;

      const content=document.createElement("div");
      content.classList.add("card-content");

      if(Array.isArray(item.value)){
        content.innerHTML=item.value.length
          ? item.value.map(v=>"• "+v).join("<br>")
          : "Tidak ada data tersedia";
      }else{
        content.innerHTML=item.value || "Tidak ada data tersedia";
      }

      card.appendChild(title);
      card.appendChild(content);

      card.addEventListener("click",()=>{
        card.classList.toggle("open");
      });

      container.appendChild(card);
    });

    lastUpdate.innerText="Update terakhir: "+new Date().toLocaleTimeString();
  });
}

setInterval(()=>{
  if(sessionStorage.getItem("auth")==="true"){
    loadDashboard();
  }
},30000);
</script>

</body>
</html>
