<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran Petani - Sumber Teknik</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;user-select:none;-webkit-user-select:none;}
body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
.app{width:100%;max-width:430px;background:#f7fbf8;height:100vh;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.25);}

/* HEADER */
.header{padding:20px;background:linear-gradient(135deg,#0d5c2a,#1f8f45);color:white;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
.back-btn{cursor:pointer;font-size:24px;color:white;}
.header-text h1{font-size:1.1rem;font-weight:700;}

/* CONTENT */
.content{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:18px;}

.form-card{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,0.08);}

.tap-highlight{transition:0.15s;background:#00000022;}
input.tap-highlight,select.tap-highlight{-webkit-tap-highlight-color:transparent;outline:none;}

.input-container{position:relative;margin-bottom:16px;}
.input-container input,.input-container select{
width:100%;
padding:14px 12px 14px 36px;
border:1px solid #d9e6dd;
border-radius:12px;
font-size:0.95rem;
background:white;
}

.input-container input:focus,.input-container select:focus{border-color:#1f8f45;}

.input-container label{
position:absolute;
left:36px;
top:14px;
color:#4b5e55;
font-size:0.85rem;
pointer-events:none;
transition:0.2s;
}

.input-container input:focus + label,
.input-container input:not(:placeholder-shown) + label,
.input-container select:focus + label,
.input-container select:not([value=""]) + label{
top:-8px;
left:12px;
font-size:0.7rem;
background:white;
padding:0 4px;
color:#1f8f45;
}

.input-container .material-icons{
position:absolute;
left:8px;
top:50%;
transform:translateY(-50%);
color:#1f8f45;
font-size:20px;
}

/* PASSWORD KHUSUS */
.password-wrapper{
position:relative;
margin-bottom:16px;
}
.password-wrapper input{
width:100%;
padding:14px 44px 14px 36px;
border:1px solid #d9e6dd;
border-radius:12px;
font-size:0.95rem;
}
.password-wrapper .left-icon{
position:absolute;
left:8px;
top:50%;
transform:translateY(-50%);
color:#1f8f45;
}
.password-wrapper .right-icon{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#1f8f45;
}

/* BUTTON */
.submit-btn{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#1f8f45;
color:white;
font-weight:600;
margin-top:10px;
cursor:pointer;
}

.submit-btn:disabled{background:#a1c8a2;cursor:not-allowed;}

/* POPUP */
#popupBayar{
display:none;
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:1000;
opacity:0;
transition:opacity 0.25s ease;
}

#popupContent{
background:white;
padding:24px 32px;
border-radius:16px;
text-align:center;
max-width:80%;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
transform:scale(0.8);
transition:transform 0.25s ease;
}

#popupContent button{
padding:10px 24px;
border:none;
border-radius:12px;
background:#1f8f45;
color:white;
font-weight:600;
cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<span class="material-icons back-btn" onclick="goBack()">arrow_back</span>
<div class="header-text">
<h1>Pembayaran Petani</h1>
</div>
</div>

<div class="content">

<div class="form-card">

<div class="input-container">
<span class="material-icons">person</span>
<select id="namaPetani" class="tap-highlight">
<option value="">Pilih Petani</option>
</select>
<label>Nama Petani</label>
</div>

<div class="input-container">
<span class="material-icons">payments</span>
<input type="number" id="jumlahBayar" placeholder=" ">
<label>Jumlah Pembayaran</label>
</div>

<div class="input-container">
<span class="material-icons">engineering</span>
<select id="namaOperator" class="tap-highlight">
<option value="">Pilih Operator</option>
</select>
<label>Nama Operator</label>
</div>

<!-- 🔐 SANDI OPERATOR -->
<div class="password-wrapper">
<input type="password" id="sandiOperator" placeholder="Sandi Operator">
<span class="material-icons left-icon">lock</span>
<span class="material-icons right-icon" id="toggleSandi">visibility</span>
</div>

<div class="input-container">
<span class="material-icons">account_balance</span>
<input type="number" id="setorKeBos" placeholder=" ">
<label>Setor ke Bos</label>
</div>

<button class="submit-btn" id="submitBtn" onclick="submitPembayaran()">Bayar</button>

</div>
</div>
</div>

<div id="popupBayar">
<div id="popupContent">
<p>Pembayaran berhasil disimpan</p>
<p id="jumlahPopup" style="font-size:1.1rem;font-weight:700;color:#1f8f45;margin-bottom:24px;"></p>
<button onclick="closePopup()">Tutup</button>
</div>
</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbxfPuJmalnJcxoLCfgvERkKMlPX1j2e5PEPn_zgpxDj9aszo8g9tp1UtCqPei_5AQgv/exec";

function goBack(){ window.location.href="subpembayaran.html"; }

/* load daftar petani */
const petaniSelect=document.getElementById("namaPetani");

fetch(API_URL+"?action=getPetaniPembayaran")
.then(res=>res.json())
.then(data=>{
  petaniSelect.innerHTML='<option value="">Pilih Petani</option>';
  data.petani.forEach(nama=>{
    let opt=document.createElement("option");
    opt.value=nama;
    opt.text=nama;
    petaniSelect.appendChild(opt);
  });
});

/* load operator + sandi */
const operatorSelect = document.getElementById("namaOperator");
const sandiInput = document.getElementById("sandiOperator");
const toggleSandi = document.getElementById("toggleSandi");
let operatorPasswords = [];

toggleSandi.onclick = () => {
  sandiInput.type = sandiInput.type === "password" ? "text" : "password";
  toggleSandi.innerText = sandiInput.type === "text" ? "visibility_off" : "visibility";
};

fetch(API_URL)
.then(res=>res.json())
.then(data=>{
  operatorSelect.innerHTML='<option value="">Pilih Operator</option>';
  data.totalUnitAktif.forEach((nama,i)=>{
    let opt=document.createElement("option");
    opt.value=nama;
    opt.text=nama;
    operatorSelect.appendChild(opt);
    operatorPasswords[i] = data.totalPinjaman[i]; // pastikan API mengirim sandi operator
  });
});

/* popup */
function showPopup(jumlah){
  let popup=document.getElementById("popupBayar");
  let content=document.getElementById("popupContent");
  document.getElementById("jumlahPopup").innerText="Rp "+jumlah;
  popup.style.display="flex";
  void popup.offsetWidth;
  popup.style.opacity="1";
  content.style.transform="scale(1)";
}

function closePopup(){
  let popup=document.getElementById("popupBayar");
  let content=document.getElementById("popupContent");
  popup.style.opacity="0";
  content.style.transform="scale(0.8)";
  setTimeout(()=>popup.style.display="none",250);
}

document.getElementById("popupBayar").addEventListener("click",(e)=>{
  if(e.target.id==="popupBayar") closePopup();
});

/* submit pembayaran */
let submitting=false;

function submitPembayaran(){

  if(submitting) return;

  const nama=petaniSelect.value;
  const jumlah=document.getElementById("jumlahBayar").value;
  const operator=operatorSelect.value;
  const idx = operatorSelect.selectedIndex - 1;
  const setor=document.getElementById("setorKeBos").value;

  if(!nama || !jumlah || !operator){
    alert("Isi data terlebih dahulu");
    return;
  }

  if(idx<0 || sandiInput.value!==operatorPasswords[idx]){
    alert("Sandi Operator salah");
    return;
  }

  submitting=true;
  document.getElementById("submitBtn").disabled=true;

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"bayarPetani",
      namaPetani:nama,
      jumlahBayar:jumlah,
      namaOperator:operator,
      setorKeBos:setor
    })
  })
  .then(res=>res.json())
  .then(resp=>{
    submitting=false;
    document.getElementById("submitBtn").disabled=false;

    if(resp.status==="success"){
      showPopup(jumlah);
      document.getElementById("jumlahBayar").value="";
      document.getElementById("setorKeBos").value="";
      petaniSelect.selectedIndex=0;
      operatorSelect.selectedIndex=0;
      sandiInput.value="";
    }
  })
  .catch(()=>{
    submitting=false;
    document.getElementById("submitBtn").disabled=false;
    alert("Terjadi kesalahan.");
  });

}

</script>

</body>
</html>
