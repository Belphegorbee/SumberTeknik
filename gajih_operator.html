<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operator - Sumber Teknik</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
  user-select:none;
  -webkit-user-select:none;
}

body{
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.app{
  width:100%;
  max-width:430px;
  background:#f7fbf8;
  height:100vh;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,0.25);
}

.header{
  padding:20px;
  background:linear-gradient(135deg,#0d5c2a,#1f8f45);
  color:white;
  display:flex;
  align-items:center;
  position:relative;
}

.back-btn{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  font-size:24px;
  cursor:pointer;
}

.header-text h1{
  font-size:1.1rem;
  font-weight:700;
  width:100%;
  text-align:center;
}

.content{
  flex:1;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.form-card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.input-container{
  position:relative;
  margin-bottom:16px;
}

.input-container input,
.input-container select{
  width:100%;
  padding:14px 12px 14px 36px;
  border:1px solid #d9e6dd;
  border-radius:12px;
  font-size:0.95rem;
}

.input-container .material-icons{
  position:absolute;
  left:8px;
  top:50%;
  transform:translateY(-50%);
  color:#1f8f45;
}

.password-wrapper{
  position:relative;
  margin-bottom:16px;
}

.password-wrapper input{
  width:100%;
  padding:14px 44px 14px 36px;
  border:1px solid #d9e6dd;
  border-radius:12px;
}

.password-wrapper .left-icon{
  position:absolute;
  left:8px;
  top:50%;
  transform:translateY(-50%);
  color:#1f8f45;
}

.password-wrapper .right-icon{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#1f8f45;
}

.submit-btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:12px;
  background:#1f8f45;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.table-container{
  background:white;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
  overflow:auto;
  max-height:420px;
}

.data-table{
  width:100%;
  border-collapse:collapse;
  font-size:0.87rem;
}

.data-table th,
.data-table td{
  padding:11px 6px;
  text-align:center;
  border-bottom:1px solid #e5e5e5;
}

.data-table th{
  background:#1f8f45;
  color:white;
  position:sticky;
  top:0;
  z-index:2;
}

.data-table tr:nth-child(even){
  background:#f8fbf9;
}

/* TOTAL ROW */
.total-row td{
  font-weight:700;
  background:#e8f5e9;
  color:#1f8f45;
  padding:13px 6px;
}

.sisa-row td{
  font-weight:700;
  background:#c8e6c9;
  color:#1f8f45;
  font-size:1rem;
}

/* POPUP */
#popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.popup-content{
  background:white;
  padding:20px 30px;
  border-radius:12px;
  text-align:center;
  font-weight:600;
}
</style>
</head>

<body>

<div class="app">
  <div class="header">
    <span class="material-icons back-btn" onclick="goBack()">arrow_back</span>
    <div class="header-text">
      <h1>Data Operator</h1>
    </div>
  </div>

  <div class="content">
    <div class="form-card">
      <div class="input-container">
        <span class="material-icons">event</span>
        <input type="date" id="tanggalMulai">
      </div>
      <div class="input-container">
        <span class="material-icons">event</span>
        <input type="date" id="tanggalAkhir">
      </div>
      <div class="input-container">
        <span class="material-icons">person</span>
        <select id="namaOperator">
          <option value="">Pilih Operator</option>
        </select>
      </div>

      <div class="password-wrapper">
        <input type="password" id="sandiOperator" placeholder="Sandi Operator">
        <span class="material-icons left-icon">lock</span>
        <span class="material-icons right-icon" id="toggleSandi">visibility</span>
      </div>

      <button class="submit-btn" onclick="loadData()">Cari Data</button>
    </div>

    <div id="hasil"></div>
  </div>
</div>

<div id="popup">
  <div class="popup-content" id="popupText">Pesan</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxfPuJmalnJcxoLCfgvERkKMlPX1j2e5PEPn_zgpxDj9aszo8g9tp1UtCqPei_5AQgv/exec";

let pinjamanList = [];

const sandiInput = document.getElementById("sandiOperator");
const toggleSandi = document.getElementById("toggleSandi");

toggleSandi.onclick = () => {
  sandiInput.type = sandiInput.type === "password" ? "text" : "password";
  toggleSandi.innerText = sandiInput.type === "text" ? "visibility_off" : "visibility";
};

function goBack(){
  window.location.href = "index.html";
}

// Load daftar operator
fetch(API_URL)
.then(res => res.json())
.then(data => {
  if(data.totalUnitAktif){
    data.totalUnitAktif.forEach((op, i) => {
      let opt = document.createElement("option");
      opt.value = op;
      opt.text = op;
      document.getElementById("namaOperator").appendChild(opt);
      pinjamanList[i] = data.totalPinjaman[i];
    });
  }
});

function showPopup(text){
  const popup = document.getElementById("popup");
  document.getElementById("popupText").innerText = text;
  popup.style.display = "flex";
  setTimeout(() => popup.style.opacity = "1", 10);
  setTimeout(() => {
    popup.style.opacity = "0";
    setTimeout(() => popup.style.display = "none", 250);
  }, 1800);
}

function loadData(){
  const mulai = document.getElementById("tanggalMulai").value;
  const akhir = document.getElementById("tanggalAkhir").value;
  const operator = document.getElementById("namaOperator").value;
  const idx = document.getElementById("namaOperator").selectedIndex - 1;

  if(!mulai || !akhir || !operator){
    showPopup("Lengkapi semua filter");
    return;
  }

  if(pinjamanList[idx] != sandiInput.value){
    showPopup("Sandi Operator salah!");
    return;
  }

  fetch(`\( {API_URL}?action=getOperatorData&tanggalMulai= \){mulai}&tanggalAkhir=\( {akhir}&namaOperator= \){encodeURIComponent(operator)}`)
  .then(res => res.json())
  .then(response => {
    const data = response.data || [];
    const hasilDiv = document.getElementById("hasil");

    hasilDiv.innerHTML = "";

    if(data.length === 0){
      hasilDiv.innerHTML = `<p style="text-align:center; padding:30px; color:#666;">Tidak ada data untuk periode tersebut</p>`;
      return;
    }

    let totalKarung = 0;
    let totalPendapatan = 0;
    let totalPinjaman = 0;

    let html = `
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Karung</th>
              <th>Harga</th>
              <th>Total</th>
              <th>Pinjaman</th>
            </tr>
          </thead>
          <tbody>`;

    data.forEach(row => {
      const karung = parseFloat(row.jumlahKarungan) || 0;
      const harga = parseFloat(row.hargaPerKarung) || 0;
      const total = parseFloat(row.totalPendapatan) || 0;
      const pinjaman = parseFloat(row.pinjaman) || 0;

      totalKarung += karung;
      totalPendapatan += total;
      totalPinjaman += pinjaman;

      html += `
        <tr>
          <td>${row.tanggal || '-'}</td>
          <td>${karung}</td>
          <td>${harga.toLocaleString('id-ID')}</td>
          <td>${total.toLocaleString('id-ID')}</td>
          <td>${pinjaman ? pinjaman.toLocaleString('id-ID') : '-'}</td>
        </tr>`;
    });

    const sisaGajih = totalPendapatan - totalPinjaman;

    html += `
          </tbody>
          <tfoot>
            <tr class="total-row">
              <td><strong>Total</strong></td>
              <td><strong>${totalKarung}</strong></td>
              <td></td>
              <td><strong>${totalPendapatan.toLocaleString('id-ID')}</strong></td>
              <td><strong>${totalPinjaman.toLocaleString('id-ID')}</strong></td>
            </tr>
            <tr class="sisa-row">
              <td colspan="3"><strong>Sisa Gajih Bersih</strong></td>
              <td colspan="2"><strong>${sisaGajih.toLocaleString('id-ID')}</strong></td>
            </tr>
          </tfoot>
        </table>
      </div>`;

    hasilDiv.innerHTML = html;
  })
  .catch(err => {
    console.error(err);
    showPopup("Terjadi kesalahan saat mengambil data");
  });
}

// Anti copy
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
</script>

</body>
</html>
