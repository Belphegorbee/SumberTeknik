<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; user-select:none; }
body {

}
.app {

.header {

.content { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:16px; }

.form-card {

}

.input-container { position:relative; margin-bottom:16px; }
.input-container input, .input-container select {

}
.input-container .material-icons {
  position:absolute; left:8px; top:50%; transform:translateY(-50%); color:#1f8f45;
}

.password-wrapper { position:relative; margin-bottom:16px; }
.password-wrapper input {
  width:100%; padding:14px 44px 14px 36px; border:1px solid #d9e6dd; border-radius:12px;
}
.password-wrapper .left-icon { position:absolute; left:8px; top:50%; transform:translateY(-50%); color:#1f8f45; }
.password-wrapper .right-icon { position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#1f8f45; }

.submit-btn {

  font-weight:600; cursor:pointer;
}

.table-container {
  background:white; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.08); overflow:auto; max-height:420px;
}
.data-table { width:100%; border-collapse:collapse; font-size:0.87rem; }
.data-table th, .data-table td { padding:11px 6px; text-align:center; border-bottom:1px solid #e5e5e5; }
.data-table th { background:#1f8f45; color:white; position:sticky; top:0; z-index:2; }
.data-table tr:nth-child(even) { background:#f8fbf9; }

.total-row td { font-weight:700; background:#e8f5e9; color:#1f8f45; padding:13px 6px; }
.sisa-row td { font-weight:700; background:#c8e6c9; color:#1f8f45; font-size:1rem; }

#popup {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5);
  justify-content:center; align-items:center; z-index:1000;
}
.popup-content {
  background:white; padding:20px 30px; border-radius:12px; text-align:center; font-weight:600;
}
</style>
</head>
